name: HollyFrontier
aid: hollyfrontier
specificationVersion: '0.23'
description: >-
  HollyFrontier Corporation (NYSE: HFC) was an independent petroleum refiner and marketer
  headquartered in Dallas, Texas, formed by the 2011 merger of Holly Corporation and
  Frontier Oil. It operated refineries across the mid-continent, southwest and Rocky
  Mountain regions, producing and marketing gasoline, diesel fuel, jet fuel, asphalt and
  specialty lubricant products, and held the general partner interest in Holly Energy
  Partners. In 2022 HollyFrontier completed its transactions with The Sinclair Companies
  and was reorganized under a new parent, HF Sinclair Corporation (NYSE: DINO); the
  HollyFrontier brand no longer operates independently and www.hollyfrontier.com now
  redirects to www.hfsinclair.com.
